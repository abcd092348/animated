<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030712">
<title>MH Group | Future Starts Here</title>

<style>
:root {
  --bg: #030712;
  --panel: rgba(9, 24, 46, .78);
  --blue: #00d9ff;
  --blue2: #3478ff;
  --text: #f4f9ff;
  --muted: #91a8c7;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  overflow-x: hidden;
}

body.loading {
  overflow: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
}

/* LOADING SCREEN */

#loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  background: #020611;
  transition: opacity .7s ease, visibility .7s ease;
}

#loader.done {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loader-content {
  width: min(320px, 80vw);
  text-align: center;
}

.loader-logo {
  font-size: 64px;
  font-weight: 900;
  letter-spacing: -5px;
  margin-bottom: 14px;
  animation: logoPulse 1.3s infinite alternate;
}

.loader-logo span {
  color: var(--blue);
}

.loader-label {
  color: #a8c5e9;
  letter-spacing: 5px;
  font-size: 11px;
  margin-bottom: 25px;
}

.progress-track {
  height: 3px;
  background: #14243a;
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--blue2), var(--blue));
  box-shadow: 0 0 15px var(--blue);
  animation: loadingProgress 1.5s ease forwards;
}

@keyframes loadingProgress {
  to { width: 100%; }
}

@keyframes logoPulse {
  from {
    opacity: .55;
    filter: drop-shadow(0 0 2px #00d9ff);
  }
  to {
    opacity: 1;
    filter: drop-shadow(0 0 22px #00d9ff);
  }
}

/* BACKGROUND */

#particles {
  position: fixed;
  inset: 0;
  z-index: -1;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.background {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 35%, #07315b 0%, transparent 47%),
    radial-gradient(ellipse at 90% 90%, #081e42 0%, transparent 35%),
    var(--bg);
}

.grid-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .12;
  background-image:
    linear-gradient(#1b6caa 1px, transparent 1px),
    linear-gradient(90deg, #1b6caa 1px, transparent 1px);
  background-size: 55px 55px;
  mask-image: linear-gradient(to bottom, black, transparent 85%);
}

/* NAVIGATION */

nav {
  position: sticky;
  top: 0;
  z-index: 100;
  min-height: 76px;
  padding: 0 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 1px solid rgba(58, 151, 216, .17);
  background: rgba(3, 7, 18, .78);
  backdrop-filter: blur(18px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: .5px;
}

.brand-mark {
  font-size: 29px;
  font-weight: 950;
  letter-spacing: -3px;
  background: linear-gradient(120deg, white 20%, var(--blue) 75%);
  color: transparent;
  background-clip: text;
  -webkit-background-clip: text;
}

nav ul {
  display: flex;
  list-style: none;
  gap: 30px;
  align-items: center;
}

nav ul a {
  color: #b8c8dd;
  font-size: 14px;
  transition: color .25s;
}

nav ul a:hover {
  color: var(--blue);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sound-toggle {
  border: 1px solid #214362;
  background: #09172a;
  color: #a6dfff;
  border-radius: 50px;
  padding: 10px 13px;
  cursor: pointer;
  font-size: 12px;
  transition: .3s;
}

.sound-toggle:hover {
  border-color: var(--blue);
  box-shadow: 0 0 15px #00d9ff20;
}

/* HERO */

.hero {
  min-height: 670px;
  min-height: min(800px, calc(100svh - 76px));
  display: grid;
  place-items: center;
  padding: 75px 22px 100px;
  position: relative;
  isolation: isolate;
}

.hero-content {
  width: min(850px, 100%);
  text-align: center;
  position: relative;
  z-index: 2;
  transform-style: preserve-3d;
  will-change: transform;
  animation: heroEnter 1.1s .1s both;
}

@keyframes heroEnter {
  from {
    opacity: 0;
    transform: translateY(28px) scale(.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 10px 15px;
  border: 1px solid #174569;
  border-radius: 50px;
  background: rgba(5, 29, 51, .65);
  color: #9feaff;
  font-size: 11px;
  letter-spacing: 3px;
  margin-bottom: 28px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #00e6b0;
  box-shadow: 0 0 12px #00e6b0;
  animation: blink 1.4s infinite;
}

@keyframes blink {
  50% { opacity: .35; }
}

h1 {
  font-size: clamp(49px, 9vw, 100px);
  font-weight: 900;
  letter-spacing: -4px;
  line-height: 1.04;
  margin-bottom: 24px;
}

.gradient-text {
  background: linear-gradient(
    100deg, #fff 5%, #8beeff 35%, #00aaff 62%, #7c86ff 90%
  );
  background-size: 220%;
  color: transparent;
  background-clip: text;
  -webkit-background-clip: text;
  animation: textFlow 5s linear infinite;
}

@keyframes textFlow {
  to { background-position: 220%; }
}

.subtitle {
  color: var(--muted);
  font-size: clamp(15px, 2vw, 19px);
  line-height: 1.9;
  max-width: 630px;
  margin: 0 auto 34px;
}

.hero-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
}

.btn {
  min-height: 50px;
  padding: 14px 24px;
  border: 1px solid #1476a8;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-size: 14px;
  font-weight: 750;
  cursor: pointer;
  transition: transform .25s, box-shadow .25s, background .25s;
}

.btn-primary {
  color: #00101a;
  border-color: transparent;
  background: linear-gradient(110deg, #00d9ff, #65aaff);
  box-shadow: 0 0 28px #00aaff24;
}

.btn-secondary {
  color: #d7f5ff;
  background: rgba(8, 26, 48, .8);
}

.btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 30px #00aaff35;
}

.btn-primary:hover {
  background: linear-gradient(110deg, white, #00d9ff);
}

.btn-secondary:hover {
  border-color: var(--blue);
}

/* 3D ORBIT */

.orbit-scene {
  position: absolute;
  width: min(510px, 88vw);
  aspect-ratio: 1;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -57%);
  perspective: 900px;
  z-index: -1;
  pointer-events: none;
}

.orbit {
  position: absolute;
  inset: 0;
  border: 1px solid rgba(0, 194, 255, .35);
  border-radius: 50%;
  box-shadow:
    inset 0 0 30px #00aaff09,
    0 0 28px #008cff09;
}

.orbit-one {
  transform: rotateX(67deg) rotateZ(0deg);
  animation: orbitSpin 13s linear infinite;
}

.orbit-two {
  inset: 10%;
  border-color: rgba(69, 119, 255, .45);
  transform: rotateY(66deg);
  animation: orbitSpin 18s linear infinite reverse;
}

.orbit-three {
  inset: 23%;
  border-color: rgba(0, 217, 255, .2);
  transform: rotateX(72deg);
  animation: orbitSpin 10s linear infinite;
}

.core {
  position: absolute;
  width: 27%;
  aspect-ratio: 1;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, #00d9ff2e, #1264ff08 70%);
  box-shadow: 0 0 70px #00aaff22;
  animation: corePulse 3s ease-in-out infinite;
}

@keyframes orbitSpin {
  from { rotate: 0deg; }
  to { rotate: 360deg; }
}

@keyframes corePulse {
  50% { scale: 1.15; opacity: .6; }
}

/* SCROLL INDICATOR */

.scroll-cue {
  position: absolute;
  bottom: 27px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 9px;
  color: #7895b5;
  font-size: 10px;
  letter-spacing: 3px;
}

.scroll-line {
  width: 1px;
  height: 30px;
  background: linear-gradient(var(--blue), transparent);
  animation: scrollPulse 1.4s infinite;
}

@keyframes scrollPulse {
  50% {
    opacity: .25;
    transform: scaleY(.65);
  }
}
